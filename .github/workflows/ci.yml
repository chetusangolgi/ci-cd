name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan files for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag shopping-cart:ci .

  test-and-scan:
    if: always()
    needs: [unit, integration, dependency-audit, trivy-scan, image-build]
    runs-on: ubuntu-latest
    env:
      UNIT_RESULT: ${{ needs.unit.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      TRIVY_RESULT: ${{ needs.trivy-scan.result }}
      IMAGE_RESULT: ${{ needs.image-build.result }}
    steps:
      - name: Require every check to pass
        run: |
          for result in "$UNIT_RESULT" "$INTEGRATION_RESULT" "$AUDIT_RESULT" "$TRIVY_RESULT" "$IMAGE_RESULT"; do
            test "$result" = success || exit 1
          done
