name: CD
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment configuration
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL" || { echo 'Set DEPLOY_WEBHOOK_URL'; exit 1; }
          test -n "$DEPLOY_WEBHOOK_TOKEN" || { echo 'Set DEPLOY_WEBHOOK_TOKEN'; exit 1; }
      - name: Set image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Trigger staging deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE: ghcr.io/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          payload=$(jq -n --arg image "$IMAGE" '{image: $image}')
          curl --fail --show-error --silent --retry 3 \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" "$DEPLOY_WEBHOOK_URL"
